<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css?family=Archivo:400,400i,500,500i,600,600i,700,700i" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="styles.css">
  <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="feed.xml">
  {{META_TAGS}}
  {{GOOGLE_ANALYTICS}}
  <script>
  (function() {
    if ('fonts' in document) {
      var font = new FontFace('Archivo', 'url(https://fonts.gstatic.com/s/archivo/v19/k3kXo84MPvpLmixcA63oeALhLOCT-xWdqOhi.woff2)');
      font.load().then(function(loadedFont) {
        document.fonts.add(loadedFont);
        document.documentElement.classList.add('fonts-loaded');
      }).catch(function() {});
    }
  })();
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header role="banner">
    <nav role="navigation" aria-label="Main navigation">
      <a href="index.html" class="home-link">{{SITE_TITLE}}</a>
      <div class="dark-mode-toggle-wrapper">
        <label class="dark-mode-toggle" for="dark-mode-checkbox">
          <input type="checkbox" id="dark-mode-checkbox" aria-label="Toggle dark mode" />
          <span class="toggle-slider" aria-hidden="true"></span>
        </label>
      </div>
    </nav>
  </header>
  <main id="main-content" role="main">
    <article class="post" aria-labelledby="post-title">
      <h1 id="post-title">{{TITLE}}</h1>
      <div class="post-meta">
        {{DATE}}
        {{READING_TIME}}
      </div>
      {{TAGS}}
      <div class="post-content">
        {{CONTENT}}
      </div>
    </article>
  </main>
  <footer role="contentinfo">
    <p>&copy; {{YEAR}}</p>
  </footer>
</body>
</html>
