<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css?family=Archivo:400,400i,500,500i,600,600i,700,700i" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="styles.css">
  <meta name="description" content="Page not found">
  <link rel="canonical" href="{{SITE_URL}}/404.html">
  {{GOOGLE_ANALYTICS}}
  <script>
  (function() {
    if ('fonts' in document) {
      var font = new FontFace('Archivo', 'url(https://fonts.gstatic.com/s/archivo/v19/k3kXo84MPvpLmixcA63oeALhLOCT-xWdqOhi.woff2)');
      font.load().then(function(loadedFont) {
        document.fonts.add(loadedFont);
        document.documentElement.classList.add('fonts-loaded');
      }).catch(function() {});
    }
  })();
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header role="banner">
    <h1><a href="index.html" class="home-link">{{SITE_TITLE}}</a></h1>
  </header>
  <main id="main-content" role="main">
    <article class="post" aria-labelledby="404-title">
      <h1 id="404-title">404 - Page Not Found</h1>
      <p>The page you're looking for doesn't exist.</p>
      <p><a href="index.html">← Back to Home</a></p>
    </article>
  </main>
  <footer role="contentinfo">
    <p>&copy; {{YEAR}}</p>
  </footer>
</body>
</html>
